<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#02040a" />
    <meta name="description" content="Portafolio audiovisual de Yair Soto." />
    <title>Yair Soto</title>
    <link rel="preload" href="./assets/hero/yair-camera.webp" as="image" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>
    <div class="cursor-glow" aria-hidden="true"></div>

    <header class="site-header">
      <a class="brand" href="#inicio" aria-label="Yair Soto">Yair Soto</a>
      <nav class="nav" aria-label="Principal">
        <a href="#reels">Reels</a>
        <a href="#fotografia">Foto</a>
        <a href="#agenda">Agenda</a>
        <a href="#contacto">Contacto</a>
      </nav>
    </header>

    <main id="inicio">
      <section class="poster-hero" aria-labelledby="hero-title">
        <div class="hero-word parallax-layer" data-depth="-0.08" data-pointer="14">
          PORTAFOLIO
        </div>
        <div class="hero-noise-card parallax-layer" data-depth="0.05" data-pointer="-8"></div>
        <img
          class="hero-camera parallax-layer"
          src="./assets/hero/yair-camera.webp"
          alt="Yair Soto con cámara"
          data-depth="0.03"
          data-pointer="-18"
        />
        <img
          class="hero-portrait parallax-layer"
          src="./assets/hero/yair-portrait.webp"
          alt=""
          aria-hidden="true"
          data-depth="0.1"
          data-pointer="10"
        />
        <div class="hero-copy parallax-layer" data-depth="-0.02" data-pointer="7">
          <p class="eyebrow">Edición / Grabación / Foto</p>
          <h1 id="hero-title">Yair Soto</h1>
          <div class="hero-actions" aria-label="Acciones principales">
            <a class="button primary" href="#reels">Ver reels</a>
            <a class="button ghost" href="#agenda">Reunión</a>
          </div>
        </div>
      </section>

      <section class="reels-section" id="reels" aria-labelledby="reels-title">
        <div class="section-head parallax-layer" data-depth="-0.015" data-pointer="3">
          <p class="section-kicker">Reels</p>
          <h2 id="reels-title">Video</h2>
        </div>

        <div class="reel-grid parallax-layer" data-depth="0.025" data-pointer="-4">
          <button class="reel-card reveal" type="button" data-reel="karting">
            <img src="./assets/photos/karting-speed.webp" alt="" loading="lazy" />
            <span>Karting</span>
          </button>
          <button class="reel-card reveal" type="button" data-reel="acapulco">
            <img src="./assets/photos/acapulco-night.webp" alt="" loading="lazy" />
            <span>Acapulco</span>
          </button>
          <button class="reel-card reveal" type="button" data-reel="puebla">
            <img src="./assets/photos/puebla-glass.webp" alt="" loading="lazy" />
            <span>Puebla</span>
          </button>
        </div>
      </section>

      <section class="photo-section" id="fotografia" aria-labelledby="photo-title">
        <div class="section-head parallax-layer" data-depth="-0.015" data-pointer="3">
          <p class="section-kicker">Fotografía</p>
          <h2 id="photo-title">Galería</h2>
        </div>

        <div class="photo-grid" aria-label="Galería fotográfica">
          <button class="photo-tile wide reveal" type="button" data-photo="./assets/photos/karting-pan.webp" data-title="Karting GDL">
            <img src="./assets/photos/karting-pan.webp" alt="Kart en movimiento en pista" loading="lazy" />
            <span>Karting GDL</span>
          </button>
          <button class="photo-tile tall reveal" type="button" data-photo="./assets/photos/acapulco-blue.webp" data-title="Acapulco">
            <img src="./assets/photos/acapulco-blue.webp" alt="Edificio azul en Acapulco" loading="lazy" />
            <span>Acapulco</span>
          </button>
          <button class="photo-tile reveal" type="button" data-photo="./assets/photos/leon-sky.webp" data-title="León">
            <img src="./assets/photos/leon-sky.webp" alt="Cielo y ciudad en León" loading="lazy" />
            <span>León</span>
          </button>
          <button class="photo-tile tall reveal" type="button" data-photo="./assets/photos/karting-driver.webp" data-title="Karting GDL">
            <img src="./assets/photos/karting-driver.webp" alt="Piloto de karting con casco azul" loading="lazy" />
            <span>Karting GDL</span>
          </button>
          <button class="photo-tile reveal" type="button" data-photo="./assets/photos/karting-grid.webp" data-title="Karting GDL">
            <img src="./assets/photos/karting-grid.webp" alt="Pilotos de karting junto a la reja de pista" loading="lazy" />
            <span>Karting GDL</span>
          </button>
          <button class="photo-tile wide reveal" type="button" data-photo="./assets/photos/karting-yair.webp" data-title="Karting GDL">
            <img src="./assets/photos/karting-yair.webp" alt="Retrato en evento de karting" loading="lazy" />
            <span>Karting GDL</span>
          </button>
          <button class="photo-tile reveal" type="button" data-photo="./assets/photos/black-stairs.webp" data-title="León">
            <img src="./assets/photos/black-stairs.webp" alt="Escalera en blanco y negro" loading="lazy" />
            <span>León</span>
          </button>
          <button class="photo-tile reveal" type="button" data-photo="./assets/photos/puebla-arches.webp" data-title="Puebla">
            <img src="./assets/photos/puebla-arches.webp" alt="Arcos interiores en Puebla" loading="lazy" />
            <span>Puebla</span>
          </button>
          <button class="photo-tile tall reveal" type="button" data-photo="./assets/photos/puebla-glass.webp" data-title="Puebla">
            <img src="./assets/photos/puebla-glass.webp" alt="Vitral en iglesia de Puebla" loading="lazy" />
            <span>Puebla</span>
          </button>
          <button class="photo-tile reveal" type="button" data-photo="./assets/photos/acapulco-night.webp" data-title="Acapulco">
            <img src="./assets/photos/acapulco-night.webp" alt="Acapulco de noche" loading="lazy" />
            <span>Acapulco</span>
          </button>
          <button class="photo-tile wide reveal" type="button" data-photo="./assets/photos/karting-speed.webp" data-title="Karting GDL">
            <img src="./assets/photos/karting-speed.webp" alt="Dos karts en pista con barrido" loading="lazy" />
            <span>Karting GDL</span>
          </button>
        </div>
      </section>

      <section class="agenda-section" id="agenda" aria-labelledby="agenda-title">
        <div class="section-head parallax-layer" data-depth="-0.015" data-pointer="3">
          <p class="section-kicker">Agenda</p>
          <h2 id="agenda-title">Reunión</h2>
        </div>

        <form class="agenda-form" id="scheduleForm">
          <label for="meetingName">Nombre</label>
          <input id="meetingName" name="meetingName" type="text" autocomplete="name" />

          <label for="meetingTime">Fecha</label>
          <input id="meetingTime" name="meetingTime" type="datetime-local" />

          <label for="meetingNote">Mensaje</label>
          <textarea id="meetingNote" name="meetingNote" rows="4"></textarea>

          <div class="contact-actions">
            <a class="button primary" id="scheduleEmail" href="mailto:yaircmpss@gmail.com">Solicitar</a>
            <a class="button ghost" id="scheduleSms" href="sms:34-117-3818">SMS</a>
            <a class="button ghost" id="calendarLink" href="#" target="_blank" rel="noreferrer">Calendario</a>
          </div>
        </form>
      </section>

      <section class="contact-section" id="contacto" aria-labelledby="contact-title">
        <div class="section-head parallax-layer" data-depth="-0.015" data-pointer="3">
          <p class="section-kicker">Contacto</p>
          <h2 id="contact-title">Mensaje</h2>
        </div>

        <form class="contact-form" id="contactForm">
          <label for="visitorName">Nombre</label>
          <input id="visitorName" name="name" type="text" autocomplete="name" />

          <label for="visitorMessage">Mensaje</label>
          <textarea id="visitorMessage" name="message" rows="5" required></textarea>

          <div class="contact-actions">
            <a class="button primary" id="phoneLink" href="sms:34-117-3818">Número</a>
            <a class="button ghost" id="emailLink" href="mailto:yaircmpss@gmail.com">Correo</a>
          </div>
        </form>
      </section>
    </main>

    <dialog class="media-modal" id="mediaModal" aria-label="Media">
      <button class="modal-close" id="modalClose" type="button" aria-label="Cerrar"></button>
      <video id="portfolioVideo" controls playsinline preload="metadata"></video>
      <img id="photoPreview" alt="" />
      <div class="modal-placeholder" id="modalPlaceholder"></div>
      <p class="modal-title" id="modalTitle"></p>
    </dialog>

    <script src="./script.js"></script>
  </body>
</html>
